services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: heimdall_db
      MYSQL_USER: heimdall
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definida — copiá .env.example a .env y completala}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD no definida en .env}
    volumes:
      - heimdall_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    image: heimdall-community-app:latest
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3005}:3005"
    environment:
      PORT: 3005
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: heimdall
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definida — copiá .env.example a .env y completala}
      DB_NAME: heimdall_db
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET no definida (generala con openssl rand -hex 32)}"
      ADMIN_PASSWORD_INICIAL: ${ADMIN_PASSWORD_INICIAL:-}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3005}
      # Nombre del sensor en el registro del SIEM (sin esto sería el id del contenedor)
      HEIMDALL_SENSOR: ${HEIMDALL_SENSOR:-heimdall-community}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - heimdall_uploads:/app/uploads
      # Registro JSON para el SIEM: el agente de Wazuh del host lo lee desde ./logs/eventos.json
      - ./logs:/app/logs

volumes:
  heimdall_db:
  heimdall_uploads:
